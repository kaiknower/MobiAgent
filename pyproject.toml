[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobiagent"
version = "0.1.0"
description = "A dual-loop agentic system for long-horizon mobile manipulation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary; private research preview"}
dependencies = ["numpy>=1.24,<2", "pillow>=10", "pyyaml>=6", "httpx>=0.27", "openai>=1.74", "msgpack>=1", "websockets>=13", "scipy>=1.11"]

[project.optional-dependencies]
discovery = ["opencv-python-headless>=4.10,<4.12", "pyarrow>=18", "google-genai>=1"]
dev = ["ruff>=0.8"]

[project.scripts]
mobiagent = "mobiagent.execution.run:main"
mobiagent-discover = "mobiagent.discovery.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mobiagent.execution" = ["*.md"]
